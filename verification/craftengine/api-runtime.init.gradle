// Optional verification only. Release builds keep gradle.properties' older API.
gradle.afterProject { project ->
    if (project != project.rootProject) return
    def runtimePath = project.providers.gradleProperty('craftEngineRuntimeJar').orNull
    def libraryPath = project.providers.gradleProperty('craftEngineRuntimeLibraries').orNull
    if (runtimePath == null || libraryPath == null) {
        throw new GradleException('Provide -PcraftEngineRuntimeJar and -PcraftEngineRuntimeLibraries for the isolated CE installation.')
    }
    def runtimeJar = project.file(runtimePath)
    def libraryRoot = project.file(libraryPath)
    if (!runtimeJar.isFile() || !libraryRoot.isDirectory()) {
        throw new GradleException('The CE plugin JAR and its initialized libs directory must exist.')
    }
    // CE bundles generated proxies in a nested JAR. Extract the matching copy,
    // rather than resolving a different proxy version from Maven.
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    runtimeJar.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
    }
    def proxyJar = project.layout.buildDirectory.file("ce-api-verification/${digest.digest().encodeHex()}/proxy.jar").get().asFile
    if (!proxyJar.isFile()) {
        def zip = new java.util.zip.ZipFile(runtimeJar)
        try {
            def proxy = zip.getEntry('proxy.jarinjar')
            if (proxy == null) throw new GradleException('The CE plugin JAR does not contain proxy.jarinjar.')
            proxyJar.parentFile.mkdirs()
            zip.getInputStream(proxy).withCloseable { input ->
                proxyJar.withOutputStream { output -> output << input }
            }
        } finally {
            zip.close()
        }
    }
    // Use CE's relocated Adventure types, not the platform's unrelocated API.
    def adventure = project.fileTree(new File(libraryRoot, 'net/kyori')) {
        include '**/*-remapped.jar'
    }
    if (adventure.isEmpty()) {
        throw new GradleException('Start the isolated CE server once to initialize its relocated Adventure libraries.')
    }
    ['compileOnly', 'testImplementation'].each { name ->
        def config = project.configurations.getByName(name)
        config.dependencies.removeAll { dependency ->
            dependency.group == 'net.momirealms' && dependency.name.startsWith('craft-engine-')
        }
        project.dependencies.add(name, project.files(runtimeJar, proxyJar, adventure))
    }
}
